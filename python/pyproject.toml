[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foliolang"
dynamic = ["version"]
description = "Folio, the programming language that reads like plain English, from Python: run Folio, and call its compiled functions for speed"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-DejaVu"]
authors = [{ name = "Samyak Pudke" }]
requires-python = ">=3.10"
keywords = ["folio", "programming language", "compiler", "ctypes", "speed", "machine code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Other",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/samyyy2423/folio"
Documentation = "https://github.com/samyyy2423/folio/blob/main/python/README.md"
Source = "https://github.com/samyyy2423/folio"
Changelog = "https://github.com/samyyy2423/folio/blob/main/CHANGELOG.md"

[project.scripts]
folio = "foliolang._cli:main"

[tool.hatch.version]
path = "src/foliolang/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/foliolang"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/foliolang", "tests", "benchmarks", "hatch_build.py", "README.md", "LICENSE", "NOTICE", "LICENSE-DejaVu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
