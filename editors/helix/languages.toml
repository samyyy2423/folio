# Folio in Helix (DESIGN §108): put this in your languages.toml (~/.config/helix/languages.toml, or
# %AppData%\helix\languages.toml on Windows), and queries/folio/highlights.scm in runtime/queries/folio/ beside
# it; then `hx --grammar fetch` and `hx --grammar build` build the colours' grammar. See editors/README.md.

[[language]]
name = "folio"
scope = "source.folio"
file-types = ["folio"]
roots = ["folio.packages"]
comment-token = "#"
indent = { tab-width = 4, unit = "    " }
language-servers = ["folio"]

[language-server.folio]
command = "folio"
args = ["lsp"]

[[grammar]]
name = "folio"
source = { git = "https://github.com/samyyy2423/folio", rev = "c020fc656271c69a3172bca37248b6f239e6efd9", subpath = "editors/tree-sitter-folio" }

# Folio's debugger (see editors/README.md): Node.js runs the debug adapter on `folio debug`. Take the # off these
# lines, and put where this repository is in args.
# [language.debugger]
# name = "folio"
# transport = "stdio"
# command = "node"
# args = ["/path/to/folio/editors/vscode/debug-adapter.js"]
#
# [[language.debugger.templates]]
# name = "launch"
# request = "launch"
# completion = [{ name = "program", completion = "filename", default = "." }]
# args = { program = "{0}" }
