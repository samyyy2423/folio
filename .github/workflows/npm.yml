# Publishes foliolang to npm when a release is published (docs/npm-package.md), made by npm/make-package.mjs
# from the release's own source, with npm's provenance: a signed record of the workflow and commit it came from.
name: npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm's provenance, and trusted publishing once npm has it set up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: node --test npm.test.js
      - run: node npm/make-package.mjs npm/dist
      - name: publish
        working-directory: npm/dist
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
