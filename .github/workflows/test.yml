name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # real servers for the live tests of tools/postgres.folio, redis.folio and s3.folio (MySQL is started below), in
    # machine.test.js; each test is skipped wherever its FOLIO_..._URL isn't set. The passwords are for these
    # throwaway containers alone.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio-test
          POSTGRES_DB: folio
          POSTGRES_HOST_AUTH_METHOD: md5 # SCRAM for a password kept as SCRAM, MD5 for one kept as MD5
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U folio" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
      minio: # MinIO itself, as Bitnami built it: MinIO no longer publishes images of its own
        image: bitnamilegacy/minio
        env:
          MINIO_ROOT_USER: folio-test-key
          MINIO_ROOT_PASSWORD: folio-test-secret
        ports: ["9000:9000"]
    env:
      FOLIO_POSTGRES_URL: postgres://folio:folio-test@127.0.0.1:5432/folio
      FOLIO_MYSQL_URL: mysql://root:folio-root@127.0.0.1:3306/folio
      FOLIO_REDIS_URL: redis://127.0.0.1:6379
      FOLIO_S3_URL: http://folio-test-key:folio-test-secret@127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # OpenBLAS and ONNX Runtime (the library in its Python package), so that the tests of arrays.folio's use_blas
      # and of tools/onnx.folio run here, not skip, as they do where those aren't installed
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libopenblas0-pthread
          python3 -m venv "$RUNNER_TEMP/ort"
          "$RUNNER_TEMP/ort/bin/pip" install -q onnxruntime
          library=$(ls "$RUNNER_TEMP"/ort/lib/python3*/site-packages/onnxruntime/capi/libonnxruntime.so.1.*)
          sudo cp "$library" /usr/local/lib/
          sudo ln -sf "$(basename "$library")" /usr/local/lib/libonnxruntime.so.1
          sudo ln -sf libonnxruntime.so.1 /usr/local/lib/libonnxruntime.so
          sudo ldconfig
      # MySQL 8.4 with mysql_native_password turned on, which takes a server option a service container can't be
      # given; then each server waited for until it answers
      - name: start MySQL, and wait for it and MinIO
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=folio-root -e MYSQL_DATABASE=folio mysql:8.4 --mysql-native-password=ON
          for i in $(seq 1 90); do docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pfolio-root --silent 2> /dev/null && break; sleep 2; done
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null && break; sleep 2; done
      # the VS Code extension (DESIGN §126), first, as it takes a minute or two: packed by vsce, as it's published,
      # what's packed checked, and its tests run in VS Code itself on that .vsix, with folio and without, in the
      # newest VS Code and in 1.75, the oldest it says it works in
      - name: pack the VS Code extension, and check the package
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npx @vscode/vsce package
          npx @vscode/vsce ls
          node check-package.mjs
      - name: test the VS Code extension in VS Code
        run: |
          node bootstrap.mjs
          cd editors/vscode
          xvfb-run -a node e2e/run.mjs
          FOLIO_VSCODE_VERSION=1.75.0 xvfb-run -a node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: folio-vscode-extension
          path: editors/vscode/folio-*.vsix
      # the JavaScript engines, the playground's, and machine.folio's machine code against them, folio.exe included; on
      # a display of Xvfb's, where there's one, for tools/linux.folio's GTK windows
      - run: if command -v xvfb-run > /dev/null; then xvfb-run -a npm test; else npm test; fi

  # a program made a DLL (DESIGN §129) and called from C, on Windows itself: the Windows-only parts of a library
  # (its lock, its stack and the TEB that says where it is) run nowhere else
  library-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: gcc --version
      - run: node --test --test-name-pattern="^(a library:|a library whose|a library for Windows|folio build --library)" machine.test.js
