name: An idea
description: Something Folio could do, say more clearly, or have in its standard library
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: reads
    attributes:
      label: How it might read in Folio
      description: A few lines of Folio as you'd like to write them. Folio should read like plain English.
      render: text
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options:
        - The language itself
        - The standard library
        - A package (could live in its own repository)
        - The playground, the site or the docs
        - Editors and tools
        - Not sure
